name: Aggiorna Struttura Repository

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Genera albero e aggiorna README
        run: |
          python3 - << 'EOF'
          import os

          IGNORE = {'.git', '.github', '.DS_Store'}

          def build_tree(dir_path, prefix=""):
              entries = [e for e in os.listdir(dir_path) if e not in IGNORE]
              entries.sort(key=lambda x: (not os.path.isdir(os.path.join(dir_path, x)), x.lower()))
              lines = []
              for i, entry in enumerate(entries):
                  path = os.path.join(dir_path, entry)
                  is_last = (i == len(entries) - 1)
                  connector = "└── " if is_last else "├── "
                  if os.path.isdir(path):
                      lines.append(f"{prefix}{connector}📁 {entry}/")
                      extension = "    " if is_last else "│   "
                      lines.extend(build_tree(path, prefix + extension))
                  else:
                      lines.append(f"{prefix}{connector}📄 {entry}")
              return lines

          tree_lines = ["Sistemi-Operativi_C/"] + build_tree(".")
          tree_block = "<!-- TREE_START -->\n```text\n" + "\n".join(tree_lines) + "\n```\n<!-- TREE_END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start_tag = "<!-- TREE_START -->"
          end_tag = "<!-- TREE_END -->"
          if start_tag in content and end_tag in content:
              before = content.split(start_tag)[0]
              after = content.split(end_tag)[1]
              new_content = before + tree_block + after
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
          EOF

      - name: Commit e Push modifiche
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: aggiorna struttura repository" && git push)
